<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Monkey Radio — YouTube Thumbnail</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b0d12;
        font-family:
          "SF Pro Display",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      .thumb {
        position: relative;
        width: 1280px;
        height: 720px;
        background: #0b0d12;
        overflow: hidden;
      }

      /* Mood-tinted blobs — matches stream default palette */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
      }

      .blob--blue {
        width: 620px;
        height: 620px;
        left: -120px;
        top: -80px;
        background: rgba(91, 140, 255, 0.22);
      }

      .blob--gold {
        width: 520px;
        height: 520px;
        right: -100px;
        bottom: -120px;
        background: rgba(255, 176, 32, 0.12);
      }

      .blob--purple {
        width: 400px;
        height: 400px;
        left: 42%;
        top: 55%;
        transform: translate(-50%, -50%);
        background: rgba(186, 148, 210, 0.1);
      }

      .viz-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 520px;
        height: 520px;
        transform: translate(-50%, -50%);
        opacity: 0.55;
      }

      .logo-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -58%);
        width: 340px;
        height: 340px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-glow {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.32) 0%,
          rgba(91, 140, 255, 0.12) 38%,
          transparent 68%
        );
      }

      .logo {
        position: relative;
        width: 300px;
        height: 300px;
        object-fit: contain;
      }

      .copy {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 56px;
        text-align: center;
        padding: 0 48px;
      }

      .brand {
        font-size: 88px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 0.95;
        color: #ffffff;
        text-shadow: 0 4px 32px rgba(0, 0, 0, 0.55);
      }

      .brand span {
        display: block;
        font-size: 88px;
      }

      .brand .radio {
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 72px;
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.92);
      }

      .hook {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
        padding: 14px 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(91, 140, 255, 0.45);
        box-shadow: 0 0 40px rgba(91, 140, 255, 0.18);
      }

      .hook-icon {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
      }

      .hook-text {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #8eb4ff;
        text-transform: uppercase;
      }

      .badge {
        position: absolute;
        top: 36px;
        right: 40px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.88);
      }

      .badge-dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 10px;
        border-radius: 50%;
        background: #ff4d4d;
        box-shadow: 0 0 12px rgba(255, 77, 77, 0.8);
        vertical-align: middle;
        position: relative;
        top: -2px;
      }
    </style>
  </head>
  <body>
    <div class="thumb">
      <div class="blob blob--blue"></div>
      <div class="blob blob--gold"></div>
      <div class="blob blob--purple"></div>

      <svg
        class="viz-ring"
        viewBox="0 0 520 520"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <g transform="translate(260 260)">
          <!-- Static visualizer bars — echoes stream canvas -->
          <rect x="-4" y="-210" width="8" height="42" rx="4" fill="rgba(255,255,255,0.35)" transform="rotate(0)" />
          <rect x="-4" y="-210" width="8" height="58" rx="4" fill="rgba(91,140,255,0.55)" transform="rotate(12)" />
          <rect x="-4" y="-210" width="8" height="36" rx="4" fill="rgba(255,255,255,0.28)" transform="rotate(24)" />
          <rect x="-4" y="-210" width="8" height="72" rx="4" fill="rgba(255,176,32,0.45)" transform="rotate(36)" />
          <rect x="-4" y="-210" width="8" height="48" rx="4" fill="rgba(255,255,255,0.32)" transform="rotate(48)" />
          <rect x="-4" y="-210" width="8" height="64" rx="4" fill="rgba(91,140,255,0.5)" transform="rotate(60)" />
          <rect x="-4" y="-210" width="8" height="40" rx="4" fill="rgba(255,255,255,0.25)" transform="rotate(72)" />
          <rect x="-4" y="-210" width="8" height="80" rx="4" fill="rgba(186,148,210,0.45)" transform="rotate(84)" />
          <rect x="-4" y="-210" width="8" height="52" rx="4" fill="rgba(255,255,255,0.3)" transform="rotate(96)" />
          <rect x="-4" y="-210" width="8" height="68" rx="4" fill="rgba(91,140,255,0.48)" transform="rotate(108)" />
          <rect x="-4" y="-210" width="8" height="44" rx="4" fill="rgba(255,255,255,0.27)" transform="rotate(120)" />
          <rect x="-4" y="-210" width="8" height="76" rx="4" fill="rgba(255,176,32,0.42)" transform="rotate(132)" />
          <rect x="-4" y="-210" width="8" height="50" rx="4" fill="rgba(255,255,255,0.31)" transform="rotate(144)" />
          <rect x="-4" y="-210" width="8" height="62" rx="4" fill="rgba(91,140,255,0.46)" transform="rotate(156)" />
          <rect x="-4" y="-210" width="8" height="38" rx="4" fill="rgba(255,255,255,0.24)" transform="rotate(168)" />
          <rect x="-4" y="-210" width="8" height="70" rx="4" fill="rgba(186,148,210,0.4)" transform="rotate(180)" />
          <rect x="-4" y="-210" width="8" height="46" rx="4" fill="rgba(255,255,255,0.29)" transform="rotate(192)" />
          <rect x="-4" y="-210" width="8" height="66" rx="4" fill="rgba(91,140,255,0.52)" transform="rotate(204)" />
          <rect x="-4" y="-210" width="8" height="42" rx="4" fill="rgba(255,255,255,0.26)" transform="rotate(216)" />
          <rect x="-4" y="-210" width="8" height="74" rx="4" fill="rgba(255,176,32,0.4)" transform="rotate(228)" />
          <rect x="-4" y="-210" width="8" height="54" rx="4" fill="rgba(255,255,255,0.33)" transform="rotate(240)" />
          <rect x="-4" y="-210" width="8" height="60" rx="4" fill="rgba(91,140,255,0.44)" transform="rotate(252)" />
          <rect x="-4" y="-210" width="8" height="36" rx="4" fill="rgba(255,255,255,0.22)" transform="rotate(264)" />
          <rect x="-4" y="-210" width="8" height="78" rx="4" fill="rgba(186,148,210,0.38)" transform="rotate(276)" />
          <rect x="-4" y="-210" width="8" height="48" rx="4" fill="rgba(255,255,255,0.3)" transform="rotate(288)" />
          <rect x="-4" y="-210" width="8" height="64" rx="4" fill="rgba(91,140,255,0.5)" transform="rotate(300)" />
          <rect x="-4" y="-210" width="8" height="40" rx="4" fill="rgba(255,255,255,0.25)" transform="rotate(312)" />
          <rect x="-4" y="-210" width="8" height="72" rx="4" fill="rgba(255,176,32,0.43)" transform="rotate(324)" />
          <rect x="-4" y="-210" width="8" height="56" rx="4" fill="rgba(255,255,255,0.34)" transform="rotate(336)" />
          <rect x="-4" y="-210" width="8" height="44" rx="4" fill="rgba(91,140,255,0.47)" transform="rotate(348)" />
        </g>
      </svg>

      <div class="logo-wrap">
        <div class="logo-glow"></div>
        <img
          class="logo"
          src="../logo/logo-white.png"
          alt="Monkey Radio"
        />
      </div>

      <div class="badge"><span class="badge-dot"></span>24/7 LIVE</div>

      <div class="copy">
        <div class="brand">
          <span>MONKEY</span>
          <span class="radio">RADIO</span>
        </div>
        <div class="hook">
          <svg
            class="hook-icon"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
              stroke="#8eb4ff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="hook-text">Request in chat</span>
        </div>
      </div>
    </div>
  </body>
</html>
